[project]
name = "skill-forge-backend"
version = "0.1.0"
description = "Skill Forge API for ecommerce image workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "cryptography>=44,<49",
    "pillow>=12,<14",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "python-dotenv>=1,<2",
    "openai>=2,<4",
    "deepagents>=0.7.41,<0.8",
    "langchain-openai>=1,<2",
    "pyyaml>=6,<7",
    "pypdfium2>=5,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
